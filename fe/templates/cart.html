{% extends "base.html" %}
{% block main %}
<section class="section narrow">
  <h1 class="col-h1">Tu carrito</h1>
  <div id="cart"></div>
  <div id="cartFoot" hidden>
    <p class="cart-total">Total: <b id="total"></b> <span class="tax">{{ ship_note }}</span></p>
    <button class="btn-primary" onclick="feCheckout(feCart())">Finalizar compra ➔</button>
    <p class="muted center">Pago seguro con tarjeta, Apple Pay o Google Pay. ¿Tienes el código BIENVENIDA15? Lo puedes poner en el siguiente paso.</p>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
let Q = null;   // precios del servidor en la moneda de la visita: los mismos que cobra Stripe
async function quote(){ try { const r = await fetch('/api/cart/quote', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({items: feCart().map(i=>({slug:i.slug,size:i.size,frame:i.frame,qty:i.qty}))})}); if (r.ok) Q = await r.json(); } catch(e) {} }
function render(){
  const c = feCart(), el = document.getElementById('cart');
  if (!c.length){ el.innerHTML = '<p class="muted">Tu carrito está vacío. <a href="/coleccion/todos">Ver cuadros</a></p>'; document.getElementById('cartFoot').hidden = true; return; }
  if (Q && Q.prices.length === c.length) c.forEach((i, n) => { if (Q.prices[n] != null) i.price = Q.prices[n]; });
  el.innerHTML = c.map((i,n) => `<div class="cart-row">${i.img?`<img src="${i.img}" alt="">`:''}<div><p><b>${i.title}</b></p><p class="muted">${i.kind==='lienzo'?'Lienzo':'Lámina enmarcada'} ${i.size} cm · ${i.frameName}</p>
    <p>${i.qty} × ${feMoney(i.price)}</p><button class="link" onclick="feCartRemove(${n});quote().then(render)">Quitar</button></div></div>`).join('');
  document.getElementById('total').textContent = Q && Q.prices.length === c.length ? Q.total_text : feMoney(c.reduce((s,i)=>s+i.price*i.qty,0));
  document.getElementById('cartFoot').hidden = false;
}
quote().then(render);
</script>
{% endblock %}
